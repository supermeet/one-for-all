[project]
name = "one-for-all"
version = "0.0.1"
description = "A private, local memory and judgment layer that any AI client can borrow, over MCP."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "platformdirs>=4.0",
]

[project.scripts]
one-for-all = "one_for_all.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/one_for_all"]
